# Docker Compose configuration for Homelab deployment
# Place this file in your homelab directory or repository root

services:
  scribenode:
    # OPTION A: Build directly from local repository source code
    build:
      context: .
      dockerfile: Dockerfile

    # OPTION B: Pull pre-built image automatically generated by GitHub Actions
    # Replace <your-github-username> and <your-repo-name> with your GitHub details:
    # image: ghcr.io/<your-github-username>/<your-repo-name>:latest

    container_name: scribenode-app
    restart: unless-stopped
    ports:
      - "3000:3000" # Expose app on port 3000 (e.g., http://homelab-ip:3000)

    environment:
      - NODE_ENV=production
      - PORT=3000
      
      # Required Gemini API Key
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # Optional: Public URL of your homelab instance (e.g. https://scribe.homelab.local or http://192.168.1.100:3000)
      - APP_URL=${APP_URL:-http://localhost:3000}
      
      # Optional: Password protection on web interface (HTTP Basic Auth)
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}

    # Optional persistent storage for temporary uploads (if needed)
    volumes:
      - scribenode_uploads:/app/uploads

volumes:
  scribenode_uploads:
