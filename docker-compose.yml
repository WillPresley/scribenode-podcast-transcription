# Docker Compose configuration for ScribeNode Homelab deployment
# Usage: docker compose up -d

services:
  scribenode:
    # Option A: Build locally from source code
    build:
      context: .
      dockerfile: Dockerfile

    # Option B: Alternatively, pull pre-built image from GitHub Container Registry (GHCR)
    # image: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME:latest

    container_name: scribenode-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}" # Expose container port (defaults to 3000, customizable via PORT)

    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      
      # Required: Google Gemini API Key
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # Optional: Base URL of your app instance (e.g., http://192.168.1.100:3000 or https://scribe.yourdomain.com)
      - APP_URL=${APP_URL:-http://localhost:3000}
      
      # Optional: Custom page title for browser tab
      - APP_TITLE=${APP_TITLE:-ScribeNode – Transcription Engine}
      
      # Optional: Enable HTTP Basic Auth for private network access
      # Basic Auth is FULLY DISABLED by default. Set BASIC_AUTH_ENABLED=true in .env to enable.
      - BASIC_AUTH_ENABLED=${BASIC_AUTH_ENABLED:-false}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}

      # Optional: Disable preseeded example items on startup (defaults to false)
      - DISABLE_DEFAULT_ITEMS=${DISABLE_DEFAULT_ITEMS:-false}

    volumes:
      - scribenode_uploads:/app/uploads

volumes:
  scribenode_uploads:

