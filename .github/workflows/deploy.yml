name: CI/CD Build and GHCR Container Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Validate Build & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (Native Git)
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
          git init -b main
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --quiet FETCH_HEAD

      - name: Setup Node.js 26 (Native NVM)
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 26 --default
          nvm use 26
          echo "$NVM_DIR/versions/node/$(nvm current)/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Type Check
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Build Application
        run: npm run build

  # AUTOMATED CONTAINER PUBLISH: GitHub Container Registry (GHCR)
  # Automatically builds and publishes the Docker image to ghcr.io/owner/scribenode-podcast-transcription:latest
  publish-container:
    name: Build & Publish Container Image (GHCR)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code (Native Git)
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
          git init -b main
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --quiet FETCH_HEAD

      - name: Authenticate to GitHub Container Registry
        run: |
          mkdir -p "$HOME/.docker"
          AUTH=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          cat <<EOF > "$HOME/.docker/config.json"
          {
            "auths": {
              "ghcr.io": {
                "auth": "${AUTH}"
              }
            }
          }
          EOF
          chmod 600 "$HOME/.docker/config.json"

      - name: Set up Docker Buildx
        run: docker buildx create --use

      - name: Build and Push Docker Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=ScribeNode - AI Speech & Transcript Engine" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${{ github.sha }}" \
            --push .

