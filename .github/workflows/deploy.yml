name: CI/CD Build and GHCR Container Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE24: 'true'

jobs:
  build-and-test:
    name: Validate Build & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Type Check
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Build Application
        run: npm run build

  # AUTOMATED CONTAINER PUBLISH: GitHub Container Registry (GHCR)
  # Automatically builds and publishes the Docker image to ghcr.io/owner/scribenode-podcast-transcription:latest
  publish-container:
    name: Build & Publish Container Image (GHCR)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        run: docker buildx create --use

      - name: Build and Push Docker Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=ScribeNode - AI Speech & Transcript Engine" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${{ github.sha }}" \
            --push .

