version: 2
updates:
  # Track npm / Node.js package updates
  # Security advisories & critical CVE fixes trigger immediately via GitHub Dependabot Security Updates.
  # Routine version updates run weekly on Monday mornings (US Eastern / New York).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      # Group all routine minor and patch dependency updates together into a single PR
      minor-and-patch-dependencies:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
      # Group major version bumps separately so breaking changes are isolated
      major-dependencies:
        applies-to: "version-updates"
        update-types:
          - "major"
    ignore:
      # Maintain TypeScript within stable major version line to prevent compiler regressions
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Track Dockerfile base image updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      docker-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"

  # Track GitHub Actions workflow action versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      actions-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
