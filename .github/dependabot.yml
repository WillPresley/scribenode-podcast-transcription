version: 2
updates:
  # Track npm / Node.js package updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      build-and-dev-tools:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "esbuild"
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "typescript"
          - "@types/*"

  # Track Dockerfile base image updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Track GitHub Actions workflow action versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
