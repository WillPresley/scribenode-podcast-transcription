version: 2
updates:
  # Track npm / Node.js package updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    groups:
      # Group all minor and patch dependency updates together into a single PR
      minor-and-patch-dependencies:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
      # Group major version bumps separately so breaking changes are isolated
      major-dependencies:
        applies-to: "version-updates"
        update-types:
          - "major"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Track Dockerfile base image updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    groups:
      docker-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"

  # Track GitHub Actions workflow action versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    groups:
      actions-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
